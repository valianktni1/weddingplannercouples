{% extends 'base.html' %}{% block content %}<main class="setup"><h1>{{ 'Set up two-step sign-in' if setup else 'Your sign-in code' }}</h1><form class="panel" method="post"><input type="hidden" name="csrf" value="{{ csrf }}">{% if setup %}<p>Add Ivory Planner to your authenticator app. Scan the code, or enter the secret manually.</p><img class="qr" src="data:image/svg+xml;base64,{{ qr }}" alt="Authenticator enrolment QR code"><p class="secret">{{ secret }}</p>{% endif %}<label class="field"><span>Authenticator code{% if not setup %} or an unused recovery code{% endif %}</span><input name="code" autocomplete="one-time-code" autofocus required></label><button class="primary">Continue</button></form></main>{% endblock %}
